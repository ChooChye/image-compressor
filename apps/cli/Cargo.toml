[package]
name = "smartimg-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "smartimg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { workspace = true }
serde_json = "1"
smartimg-core = { path = "../../crates/smartimg-core" }
smartimg-types = { path = "../../crates/smartimg-types" }
smartimg-metrics = { path = "../../crates/smartimg-metrics", features = ["ssimulacra2"] }
smartimg-codecs = { path = "../../crates/smartimg-codecs", features = ["native-avif", "native-webp"] }
smartimg-pipeline = { path = "../../crates/smartimg-pipeline", features = ["image-rs"] }
