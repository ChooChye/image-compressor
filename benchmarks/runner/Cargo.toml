[package]
name = "smartimg-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
smartimg-types = { path = "../../crates/smartimg-types" }
smartimg-metrics = { path = "../../crates/smartimg-metrics", features = ["ssimulacra2", "butteraugli"] }
smartimg-codecs = { path = "../../crates/smartimg-codecs", features = ["native-avif", "native-webp"] }
smartimg-pipeline = { path = "../../crates/smartimg-pipeline", features = ["image-rs"] }
